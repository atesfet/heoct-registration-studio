# conda env create -f environment.yml   (then: conda activate reg_env)
# PyTorch is installed separately by the launchers (tools/setup_torch.py) so that the right build is chosen
# per machine: CUDA (NVIDIA), MPS (Apple silicon) or CPU.
name: reg_env
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy
  - scipy
  - scikit-image
  - tifffile
  - imagecodecs
  - opencv
  - matplotlib
  - pandas
  - pyyaml
  - simpleitk
  - tectonic          # LaTeX engine for the PDF report (optional)
  - pip
  - pip:
      - pymupdf
