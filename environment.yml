# conda env create -f environment.yml   (then: conda activate reg_env)
name: reg_env
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy
  - scipy
  - scikit-image
  - tifffile
  - imagecodecs
  - opencv
  - matplotlib
  - pandas
  - pyyaml
  - simpleitk
  - tectonic          # LaTeX engine for the PDF report (optional)
  - pip
  - pip:
      - pymupdf
      # GPU build of PyTorch (CUDA 12.4). start_linux.sh installs it; CPU-only machines can use the default index.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch
